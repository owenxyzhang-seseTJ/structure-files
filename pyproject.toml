[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dsh-structure-files"
version = "0.1.0"
description = "Chemistry-aware CIF/POSCAR/OUTCAR file processing service for DeepSeek Harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Local DeepSeek Harness preset" }]
dependencies = [
  "ase>=3.26",
  "filelock>=3.19",
  "gemmi>=0.7",
  "mcp>=2.1.1,<3",
  "networkx>=3.2",
  "numpy>=1.26",
  "orjson>=3.10",
  "pydantic>=2.8",
  "pymatgen>=2024.8",
  "scipy>=1.11",
  "spglib>=2.4",
]

[project.optional-dependencies]
vasp = [
  "dpdata>=1.1",
  "parsevasp>=3.4",
]
ml = [
  "mace-torch>=0.3.10",
]
chemistry = [
  "rdkit>=2024.3",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
structure-files = "structure_files.cli:main"
structure-files-mcp = "structure_files.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/structure_files"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
